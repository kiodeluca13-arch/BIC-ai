<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BIC CAPIBARA COMPLETA</title>
<meta name="theme-color" content="#00FFD1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:'Inter',sans-serif;height:100dvh;overflow:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100dvh;background:#0e0e10;border-left:1px solid #ffffff12;border-right:1px solid #ffffff12;display:flex;flex-direction:column}

/* HEADER */
.header{height:56px;background:#000;border-bottom:1px solid #ffffff12;display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0}
.logo{width:40px;height:40px;background:#00FFD1;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px #00FFD1}
.live{margin-left:auto;padding:6px 12px;border-radius:20px;background:#111;border:1px solid #333;font-family:'JetBrains Mono';font-size:10px}
.live.on{background:#00FFD1;color:#000;box-shadow:0 0 20px #00FFD1}

/* VIDEOCHIAMATA - PARTE ALTA */
#call{height:48%;background:#08080a;position:relative;overflow:hidden;flex-shrink:0;border-bottom:2px solid #00FFD1}
#userCam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}
#noCam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0a0a0a}
#bicPip{position:absolute;bottom:12px;right:12px;width:96px;height:96px;border-radius:22px;border:3px solid #00FFD1;overflow:hidden;box-shadow:0 0 25px #00FFD1;z-index:5;background:#000;transition:.2s}
#bicPip.talking{transform:scale(1.1);border-color:#fff;box-shadow:0 0 45px #00FFD1}
#bicPip img{width:100%;height:100%;object-fit:cover}
#callBtns{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:6}
.cBtn{width:48px;height:48px;border-radius:50%;border:none;font-size:18px;cursor:pointer}
#micBtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid #ffffff20;backdrop-filter:blur(8px)}
#micBtn.on{background:#00FFD1;color:#000;box-shadow:0 0 20px #00FFD1}
#camBtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid #ffffff20}
#camBtn.on{background:#fff;color:#000}
