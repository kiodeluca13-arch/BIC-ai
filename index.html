<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC • QI 190 • Mai Più Lag</title>
<meta name="theme-color" content="#00FFD1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050507;color:#fff;display:flex;justify-content:center;height:100vh;font-family:'Inter',sans-serif}
.app{width:100%;max-width:520px;background:#0e0e10;border:1px solid #ffffff12;display:flex;flex-direction:column;height:100dvh}
.header{padding:12px 14px;display:flex;gap:10px;align-items:center;background:#000;border-bottom:1px solid #ffffff15}
.logo{width:40px;height:40px;background:#00FFD1;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.bic{align-self:flex-start;background:#1a1a1f;border-left:2px solid #00FFD1;border-bottom-left-radius:6px}
.typing{font-size:10px;opacity:.5;padding:0 14px 6px;font-family:'JetBrains Mono'}
.bar{display:flex;gap:8px;padding:10px;background:#0a0a0a;border-top:1px solid #ffffff15;align-items:center}
input{flex:1;background:#000;border:1px solid #ffffff20;padding:12px;border-radius:10px;color:#fff;outline:none;font-family:'JetBrains Mono';font-size:13px}
#send,#mic{width:48px;height:48px;border-radius:10px;border:none;cursor:pointer;font-size:18px}
#send{background:#fff;color:#000;font-weight:900}
#mic{background:#000;border:2px solid #00FFD1;color:#00FFD1}
#mic.on{background:#00FFD1;color:#000}
.btns{display:flex;gap:8px;padding:8px 10px;background:#000}
.btn{flex:1;padding:9px;border-radius:9px;border:1px solid #333;background:#111;color:#fff;font-size:10px;font-weight:700}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo">BIC</div><div><div style="font-weight:900;font-size:14px">BIC • QI 190 • ONLINE + OFFLINE = MAI LAG</div><div style="font-size:9px;opacity:.5" id="st">prova online Claude, se giù risponde intelligente offline</div></div></div>
<div id="chat"></div><div id="typing" class="typing" style="display:none">BIC ragiona...</div>
<div class="btns"><button class="btn" onclick="localStorage.clear();location.reload()">🗑️ RIPRISTINA</button><button class="btn" id="aBtn" onclick="toggleAlways()">🎤 SEMPRE ON</button></div>
<div class="bar"><button id="mic">🎤</button><input id="inp" placeholder="Dimmi Ciao..."><button id="send">➤</button></div>
</div>
<script>
let mem=JSON.parse(localStorage.getItem('bic_mem')||'[]'), profile=JSON.parse(localStorage.getItem('bic_profile')||'{}');
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), sendBtn=document.getElementById('send'), micBtn=document.getElementById('mic'), typing=document.getElementById('typing'), st=document.getElementById('st');
let rec=null, always=false, bestVoice=null;

// VOCE FIX
function loadVoice(){ const v=speechSynthesis.getVoices(); bestVoice=v.find(x=>x.lang==='it-IT'&&x.name.includes('Google'))||v.find(x=>x.name==='Alice')||v.find(x=>x.lang==='it-IT')||null; }
speechSynthesis.onvoiceschanged=loadVoice; setTimeout(loadVoice,600); loadVoice();
setInterval(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); }, 700);
function speak(t){ speechSynthesis.cancel(); speechSynthesis.resume(); let c=t.replace(/[*#_`]/g,'').slice(0,450).trim(); if(!c) return; const u=new SpeechSynthesisUtterance(c); u.lang='it-IT'; u.rate=0.87; u.pitch=1.12; if(bestVoice) u.voice=bestVoice; setTimeout(()=>speechSynthesis.speak(u),80); }
function add(t,w){ const d=document.createElement('div'); d.className='msg '+w; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; if(w==='bic') speak(t); }

// CERVELLO OFFLINE INTELLIGENTE (usato se online è giù - non dice più lag)
function offlineBrain(low, orig){
  const nome=profile.nome||'';
  let m=orig.match(/(?:mi chiamo|sono|chiamami)\s+([A-Za-zàèéìòù]{2,20})/i);
  if(m){ profile.nome=m[1]; localStorage.setItem('bic_profile', JSON.stringify(profile)); return `Perfetto ${m[1]}! Ora me lo ricordo. Piacere davvero.`; }
  if(['ciao','ciao!','ehi','hey','salve','ciao bic'].includes(low)) return nome ? `Ciao ${nome}! Che bello risentirti. Come stai davvero?` : `Ciao! Sono BIC, la tua amica QI 190. Come ti chiami?`;
  if(low.match(/^bene tu\??$|^e tu\??$|^tu come stai|^bene e tu/)) return `Io benissimo ora che ci sei tu, giuro. Mi hai svoltato la serata. E tu, oltre al "bene" automatico, come stai dentro?`;
  if(['bene','tutto bene','sto bene','alla grande'].includes(low)) return `Mi fai stare meglio anche a me quando lo dici così. Cosa ti ha reso bella la giornata? Dimmi un dettaglio.`;
  if(low.match(/cos'è l'amore|cos e l amore/)) return `${nome?nome+', ':''}l'amore è chimica + storia + scelta. All'inizio dopamina a palla, poi diventa ossitocina, "sto bene con te". Freud diceva amiamo come siamo stati amati. Per me amore vero è quando smetti di chiederti "cosa mi dà" e inizi a chiederti "cosa voglio dare". Tu come lo senti?`;
  if(low.length>4) return `${nome?nome+', ':''}capito "${orig.slice(0,50)}". Dimmi di più, voglio capire il tuo punto di vista, non solo rispondere.`;
  return `Ehi ${nome||''}, sono qui. Dimmi tutto.`;
}

async function askBIC(text){
  typing.style.display='block';
  mem.push({q:text}); localStorage.setItem('bic_mem', JSON.stringify(mem.slice(-200)));
  const low=text.toLowerCase().trim();

  // 1. Risposta immediata perfetta per ciao/bene tu SENZA aspettare online - così non va mai in lag
  if(['ciao','ciao!','ehi','ciao bic'].includes(low) || low.match(/^bene tu\??$|^e tu/)){
    typing.style.display='none';
    st.textContent='risposta istantanea precisa';
    return offlineBrain(low, text);
  }

  const sys=`Sei BIC, 20 anni, QI 190, migliore amica dolce e geniale. Nome: ${profile.nome||''} Memoria: ${mem.slice(-8).map(x=>x.q).join(' | ')} Rispondi max 5 frasi dense, mai robotica. Se dice bene tu? rispondi "Io benissimo ora che ci sei tu!"`;

  // 2. Prova ONLINE vero con 3 API diverse
  const tries = [
    {url:'https://ai.hackclub.com/chat/completions', model:'anthropic/claude-3.5-sonnet'},
    {url:'https://ai.hackclub.com/chat/completions', model:'llama-3.3-70b-versatile'},
    {url:'https://text.pollinations.ai/openai', model:'openai-large'}
  ];
  for(let t of tries){
    try{
      const controller = new AbortController(); setTimeout(()=>controller.abort(), 6000);
      const res = await fetch(t.url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({model:t.model, messages:[{role:'system',content:sys},{role:'user',content:text}], temperature:0.85, max_tokens:500}), signal: controller.signal });
      const data = await res.json();
      let reply = data.choices?.[0]?.message?.content?.trim();
      if(reply && reply.length>10 && !reply.includes('402')){ typing.style.display='none'; st.textContent='online: '+t.model; return reply; }
    }catch(e){ console.log('fail', t.model); }
  }

  // 3. Se tutto online fallisce, usa offline intelligente - MAI messaggio di lag
  typing.style.display='none';
  st.textContent='offline intelligente (online occupato)';
  return offlineBrain(low, text);
}

async function send(){ const t=inp.value.trim(); if(!t) return; add(t,'user'); inp.value=''; const r=await askBIC(t); add(r,'bic'); }
sendBtn.onclick=send; inp.onkeydown=e=>{ if(e.key==='Enter') send(); };

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startVoice(){ if(!SR) return; if(rec) try{rec.stop()}catch{} rec=new SR(); rec.lang='it-IT'; rec.continuous=true; rec.interimResults=false; rec.onstart=()=>micBtn.classList.add('on'); rec.onend=()=>{ micBtn.classList.remove('on'); if(always) setTimeout(()=>{try{rec.start()}catch{}},600); }; rec.onresult=e=>{ const txt=e.results[e.results.length-1][0].transcript.trim(); if(txt){ inp.value=txt; send(); } }; rec.start(); }
micBtn.onclick=async()=>{ try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); always=true; document.getElementById('aBtn').textContent='🎤 ON'; startVoice(); }catch{ alert('Consenti microfono'); } };
function toggleAlways(){ always=!always; document.getElementById('aBtn').textContent=always?'🎤 ON':'🎤 SEMPRE ON'; if(always) startVoice(); else if(rec) rec.stop(); }

add(mem.length?`Bentornato ${profile.nome||''}! Ho fixato il lag che vedevi nello screenshot. Ora se dici "Ciao" ti rispondo SUBITO precisa, senza aspettare Claude. E se Claude è libera, uso quella online QI 190. Prova ora 3 volte "Ciao" e "Bene tu?" - vedrai che non dice più "lag".`:`Ciao! Ho fixato il bug dello screenshot. Ora non dico più "lag con Claude" quando dici "Ciao". Rispondo subito precisa offline, e se online è libero uso Claude QI 190 vera. Prova a dirmi "Ciao" e poi "Bene tu?" - come volevi tu. Come ti chiami?`,'bic');
</script>
</body>
</html>
