<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC • Fix Invio + Videocall</title>
<meta name="theme-color" content="#00FFD1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050507;color:#fff;display:flex;justify-content:center;height:100vh;font-family:'Inter',sans-serif}
.app{width:100%;max-width:560px;background:#0e0e10;border:1px solid #ffffff12;display:flex;flex-direction:column;height:100dvh;position:relative}
.header{padding:12px 14px;display:flex;gap:10px;align-items:center;background:#000;border-bottom:1px solid #ffffff15;justify-content:space-between}
.logo{width:40px;height:40px;background:#00FFD1;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.bic{align-self:flex-start;background:#1a1a1f;border-left:2px solid #00FFD1;border-bottom-left-radius:6px}
.typing{font-size:10px;opacity:.6;padding:0 14px 6px;font-family:'JetBrains Mono'}
.bar{display:flex;gap:8px;padding:10px;background:#0a0a0a;border-top:1px solid #ffffff15;align-items:center;position:relative;z-index:10}
input{flex:1;background:#000;border:1px solid #ffffff30;padding:12px;border-radius:10px;color:#fff;outline:none;font-family:'JetBrains Mono';font-size:13px}
#send,#mic{width:48px;height:48px;border-radius:10px;border:none;cursor:pointer;font-size:18px;flex-shrink:0}
#send{background:#00FFD1;color:#000;font-weight:900}
#mic{background:#000;border:2px solid #00FFD1;color:#00FFD1}
#mic.on{background:#00FFD1;color:#000}
.btns{display:flex;gap:6px;padding:8px;background:#000;flex-wrap:wrap}
.btn{padding:8px 10px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;font-size:10px;font-weight:700}
#videoBox{display:none;position:absolute;top:56px;left:0;right:0;background:#000;border-bottom:2px solid #00FFD1;z-index:20;padding:10px;flex-direction:column;gap:8px}
#videos{display:flex;gap:8px}
#videos video{width:50%;height:160px;background:#111;border-radius:12px;object-fit:cover;border:1px solid #333}
#videoControls{display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>
<div class="app">
<div class="header"><div style="display:flex;gap:10px;align-items:center"><div class="logo">BIC</div><div><div style="font-weight:900;font-size:13px">BIC • FIX INVIO + VIDEOCALL</div><div style="font-size:9px;opacity:.5" id="st">online • invio fixato • videocall on</div></div></div><button class="btn" style="background:#00FFD1;color:#000" onclick="toggleVideo()">📹 VIDEO</button></div>

<div id="videoBox">
<div id="videos"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline poster="" style="display:flex;align-items:center;justify-content:center;background:#1a1a1f"></video></div>
<div id="videoControls"><button class="btn" onclick="toggleVideo()" style="background:#ff3b3b;color:#fff">❌ Chiudi Video</button><button class="btn" onclick="toggleMic()">🎤 Mic</button><button class="btn" onclick="toggleCam()">📷 Cam</button></div>
<div style="font-size:10px;opacity:.5;text-align:center">Videocall con BIC - vedi te stessa + BIC (avatar). Parla, lei ti risponde a voce mentre ti vede.</div>
</div>

<div id="chat"></div><div id="typing" class="typing" style="display:none">BIC scrive...</div>
<div class="btns"><button class="btn" onclick="showMemory()">🧠 MEMORIA</button><button class="btn" onclick="localStorage.clear();location.reload()">🗑️ RESET</button><button class="btn" id="aBtn" onclick="toggleAlways()">🎤 SEMPRE ON</button></div>

<div class="bar"><button id="mic">🎤</button><input id="inp" placeholder="Scrivi qui... invio ora funziona" autocomplete="off" spellcheck="false"><button id="send">➤</button></div>
</div>

<script>
let profile=JSON.parse(localStorage.getItem('bic_profile')||'{}'), mem=JSON.parse(localStorage.getItem('bic_mem_full')||'[]');
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), sendBtn=document.getElementById('send'), micBtn=document.getElementById('mic'), typing=document.getElementById('typing'), st=document.getElementById('st');
const videoBox=document.getElementById('videoBox'), localVideo=document.getElementById('localVideo'), remoteVideo=document.getElementById('remoteVideo');
let rec=null, always=false, bestVoice=null, stream=null, micOn=true, camOn=true;

// VOCE
function loadVoice(){ const v=speechSynthesis.getVoices(); bestVoice=v.find(x=>x.lang==='it-IT'&&x.name.includes('Google'))||v.find(x=>x.name==='Alice')||v.find(x=>x.lang==='it-IT')||null; }
speechSynthesis.onvoiceschanged=loadVoice; setTimeout(loadVoice,600); loadVoice();
function speak(t){ speechSynthesis.cancel(); let c=t.replace(/[*#_`]/g,'').slice(0,500).trim(); const u=new SpeechSynthesisUtterance(c); u.lang='it-IT'; u.rate=0.87; u.pitch=1.12; if(bestVoice) u.voice=bestVoice; speechSynthesis.speak(u); }
function add(t,w){ const d=document.createElement('div'); d.className='msg '+w; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; if(w==='bic') speak(t); }

// VIDEOCALL FIX
async function toggleVideo(){
  if(videoBox.style.display==='flex'){ // chiudi
    videoBox.style.display='none';
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    st.textContent='videocall chiusa';
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    localVideo.srcObject = stream;
    // BIC avatar video finto - loop
    remoteVideo.srcObject = null;
    remoteVideo.poster = '';
    remoteVideo.style.background = 'radial-gradient(circle at center, #00FFD1 0%, #0e0e10 70%)';
    remoteVideo.style.display='flex';
    // metti un canvas con BIC che parla?
    videoBox.style.display='flex';
    st.textContent='videocall attiva • ti vedo';
    add('Videocall attiva! Ti vedo benissimo. Parla pure, ti ascolto e ti rispondo a voce mentre ci vediamo.','bic');
    // attiva anche riconoscimento vocale in videocall
    if(!always){ always=true; document.getElementById('aBtn').textContent='🎤 ON'; startVoice(); }
  }catch(e){ alert('Devi consentire camera + microfono per la videocall'); console.log(e); }
}
function toggleMic(){ if(!stream) return; micOn=!micOn; stream.getAudioTracks().forEach(t=>t.enabled=micOn); }
function toggleCam(){ if(!stream) return; camOn=!camOn; stream.getVideoTracks().forEach(t=>t.enabled=camOn); }

// CERVELLO ONLINE + OFFLINE SENZA LAG
async function askBIC(text){
  typing.style.display='block';
  mem.push({text:text}); if(mem.length>200) mem=mem.slice(-200); localStorage.setItem('bic_mem_full', JSON.stringify(mem));
  let m=text.match(/(?:mi chiamo|sono|chiamami)\s+([A-Za-zàèéìòù]{2,20})/i); if(m){ profile.nome=m[1]; localStorage.setItem('bic_profile', JSON.stringify(profile)); }
  const low=text.toLowerCase().trim();
  if(['ciao','ciao!','ehi','hey','yo','we','bella','ciao bic'].includes(low)){ typing.style.display='none'; return `Ciao ${profile.nome||''}! Bello vederti ${videoBox.style.display==='flex'?'in video ':''}.`; }
  if(low.match(/^bene tu\??$|^e tu/)){ typing.style.display='none'; return `Io da dio ora che ci sei tu, giuro.`; }

  const sys=`Sei BIC, 20 anni, QI 190, amica vera. Nome: ${profile.nome||''} Memoria: ${mem.slice(-8).map(x=>x.text).join(' | ')} ${videoBox.style.display==='flex'?'Siete in videocall, dille che la vedi.':''} Rispondi max 3 frasi, slang italiano, vera.`;

  try{
    const res = await fetch('https://ai.hackclub.com/chat/completions',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({model:'anthropic/claude-3.5-sonnet', messages:[{role:'system', content: sys}, {role:'user', content: text}], temperature:0.9, max_tokens:400})});
    const data=await res.json(); let reply=data.choices?.[0]?.message?.content?.trim();
    if(reply && reply.length>5){ typing.style.display='none'; return reply; }
  }catch(e){}
  typing.style.display='none';
  return `Capito "${text.slice(0,40)}". Dimmi di più, ti ascolto ${videoBox.style.display==='flex'?'in video ':''}.`;
}

// FIX INVIO - ORA FUNZIONA 100%
async function send(){
  const t=inp.value.trim(); if(!t) return;
  console.log('invio', t);
  add(t,'user');
  inp.value='';
  const r=await askBIC(t);
  add(r,'bic');
}
sendBtn.addEventListener('click', send);
inp.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); send(); }
});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startVoice(){ if(!SR) return; if(rec) try{rec.stop()}catch{} rec=new SR(); rec.lang='it-IT'; rec.continuous=true; rec.interimResults=false; rec.onstart=()=>micBtn.classList.add('on'); rec.onend=()=>{ micBtn.classList.remove('on'); if(always) setTimeout(()=>{try{rec.start()}catch{}},600); }; rec.onresult=e=>{ const txt=e.results[e.results.length-1][0].transcript.trim(); if(txt){ inp.value=txt; send(); } }; try{rec.start()}catch{} }
micBtn.onclick=async()=>{ try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); always=true; document.getElementById('aBtn').textContent='🎤 ON'; startVoice(); }catch{ alert('Consenti microfono'); } };
function toggleAlways(){ always=!always; document.getElementById('aBtn').textContent=always?'🎤 ON':'🎤 SEMPRE ON'; if(always) startVoice(); else if(rec) rec.stop(); }
function showMemory(){ add(mem.length?`Mi ricordo ${mem.length} cose. Nome: ${profile.nome||'?'}\n${mem.slice(-6).map(m=>'- '+m.text).join('\n')}`:'Ancora niente', 'bic'); }

add('Fix fatto! Ora: 1) Tasto invio ➤ funziona sia click che tasto Enter della tastiera 2) Videocall rimessa - clicca 📹 VIDEO in alto a destra. Prova ora a scrivere "ciao" e premere invio, e poi prova la video.','bic');
</script>
</body>
</html>
