const ALL_QUESTIONS = Object.values(BANK).flat();
console.log("Totale domande:", ALL_QUESTIONS.length); // 500+

function detectTopic(text){
  const t=text.toLowerCase();
  if(t.match(/amore|amo|ragazza|fidanzat|cuore|ti amo|innamorat|relazione|coppia|bacio/)) return 'amore';
  if(t.match(/ansia|triste|depress|giù|male|paura|panico|piang|ansioso|depresso|stanco|vuoto|perso/)) return 'ansia_triste';
  if(t.match(/moto|candela|pit bike|motore|casco|gomme|benzina|serbatoio/)) return 'moto';
  if(t.match(/scuola|studio|esame|universit|voto|prof|classe|lavoro|capo|collega|azienda|soldi/)) return 'scuola_lavoro';
  if(t.match(/amico|amicizia|amici|bro|fratello|compagn/)) return 'amicizia';
  if(t.match(/futuro|domani|tra un anno|sogno|obiettivo|diventare|voglio fare|piano/)) return 'futuro';
  if(t.match(/vita|senso|vivo|vivere|esist/)) return 'vita';
  return 'generale';
}

function getContextualQuestion(topic){
  let pool = BANK[topic] || BANK.generale;
  let available = pool.filter(q=>!usedQ.includes(q));
  if(available.length===0){
    // se finite quelle del topic, prendi da generale non usate
    available = BANK.generale.filter(q=>!usedQ.includes(q));
    if(available.length===0){ usedQ=[]; available=pool; }
  }
  const q = available[Math.floor(Math.random()*available.length)];
  usedQ.push(q); localStorage.setItem('bic_used_q', JSON.stringify(usedQ.slice(-400)));
  localStorage.setItem('bic_mem_full', JSON.stringify(mem)); updateTag();
  return q;
}

function saveMemory(text){
  let m=text.match(/(?:mi chiamo|sono|chiamami)\s+([A-Za-zàèéìòù]{2,20})/i); if(m) profile.nome=m[1];
  mem.push({text:text, time:Date.now(), topic: detectTopic(text)}); if(mem.length>400) mem=mem.slice(-400);
  localStorage.setItem('bic_profile', JSON.stringify(profile)); localStorage.setItem('bic_mem_full', JSON.stringify(mem)); updateTag();
}

function offlineSmart(text){
  const low=text.toLowerCase().trim();
  if(['ciao','ciao!','ehi','hey','yo','we','bella','ciao bic'].includes(low)) return `Ciao ${profile.nome||''}!`;
  if(low.match(/^bene tu\??$|^e tu\??$/)) return `Io da dio ora che ci sei tu, giuro.`;
  if(low.length<4) return `Dimmi.`;
  const topic = detectTopic(text);
  // 40% reazione + 60% domanda contestuale
  if(Math.random()<0.4){
    const react={
      amore: ["Si sente che ci tieni davvero.","Questo è amore vero, non fuffa.","Capito, ti ha preso proprio."],
      ansia_triste: ["Ci sta sentirsi così, non sei l'unico.","Ti capisco, davvero.","Non è debolezza quello che senti."],
      moto: ["Bella, si sente che è passione vera.","Moto life, ti capisco.","Spacca sta cosa che dici."],
      generale: ["Capito.","Ci sta.","Ha senso quello che dici.","Vero."]
    };
    const r = (react[topic]||react.generale)[Math.floor(Math.random()*3)];
    return r;
  } else {
    return getContextualQuestion(topic);
  }
}

async function askOnline(text){
  typing.style.display='block';
  saveMemory(text);
  const low=text.toLowerCase().trim();
  if(['ciao','ciao!','ehi','ciao bic','we'].includes(low) || low.match(/^bene tu\??$/)){
    typing.style.display='none';
    return offlineSmart(text);
  }
  const topic = detectTopic(text);
  const sys=`Sei BIC, 20 anni, QI 190, amica vera. Parli italiano vero, corto, al suo livello.

MEMORIA: Nome ${profile.nome||''}, ha detto prima: ${mem.slice(-8).map(m=>m.text).join(' | ')}
TOPIC RILEVATO: ${topic}
DOMANDE GIÀ USATE (non ripetere): ${usedQ.slice(-30).join(' | ')}

REGOLE FONDAMENTALI:
- Capisci il SENSO di quello che ti dice: "${text}" è su ${topic}, quindi rispondi su ${topic}, non a caso
- Se parla di amore → fai domande / riflessioni sull'amore con senso compiuto
- Se parla di ansia/tristezza → sii dolce, capisci, non fare domande stupide
- Se parla di moto → parla di moto
- Max 2-3 frasi, mai 10 domande di fil
