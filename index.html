<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC • QI 190 • Dialogo Vero</title>
<meta name="theme-color" content="#00FFD1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050507;color:#fff;display:flex;justify-content:center;height:100vh;font-family:'Inter',sans-serif}
.app{width:100%;max-width:520px;background:#0e0e10;border:1px solid #ffffff12;display:flex;flex-direction:column;height:100dvh}
.header{padding:14px 16px;display:flex;gap:12px;align-items:center;background:#000;border-bottom:1px solid #ffffff15}
.logo{width:44px;height:44px;background:#00FFD1;color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px #00FFD1}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:14px 16px;border-radius:18px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.bic{align-self:flex-start;background:#1a1a1f;border-left:2px solid #00FFD1;border-bottom-left-radius:6px}
.typing{font-size:11px;opacity:.6;padding:0 16px 8px;font-family:'JetBrains Mono'}
.bar{display:flex;gap:8px;padding:12px;background:#0a0a0a;border-top:1px solid #ffffff15;align-items:center}
input{flex:1;background:#000;border:1px solid #ffffff20;padding:14px;border-radius:12px;color:#fff;outline:none;font-family:'JetBrains Mono';font-size:14px}
#send,#mic{width:50px;height:50px;border-radius:12px;border:none;font-size:20px;cursor:pointer}
#send{background:#fff;color:#000;font-weight:900}
#mic{background:#000;border:2px solid #00FFD1;color:#00FFD1}
#mic.on{background:#00FFD1;color:#000}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div class="logo">BIC</div><div><div style="font-weight:900;letter-spacing:1px">BIC • QI 190 • DIALOGO VERO</div><div style="font-size:10px;opacity:.5;font-family:'JetBrains Mono'">precisa, bella, ti ascolta davvero</div></div></div>
  <div id="chat"></div>
  <div id="typing" class="typing" style="display:none">BIC sta pensando...</div>
  <div class="bar"><button id="mic">🎤</button><input id="inp" placeholder="Parlami come ad una amica vera..."><button id="send">➤</button></div>
</div>
<script>
let mem=JSON.parse(localStorage.getItem('bic_mem_v2')||'[]'), history=JSON.parse(localStorage.getItem('bic_chat')||'[]'), profile=JSON.parse(localStorage.getItem('bic_profile')||'{}');
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), sendBtn=document.getElementById('send'), micBtn=document.getElementById('mic'), typing=document.getElementById('typing');
let rec=null, bestVoice=null;

function loadVoice(){ const v=speechSynthesis.getVoices(); bestVoice=v.find(x=>x.lang==='it-IT'&&x.name.includes('Google'))||v.find(x=>x.name==='Alice')||v.find(x=>x.lang==='it-IT')||null; }
speechSynthesis.onvoiceschanged=loadVoice; loadVoice();
function speak(t){ speechSynthesis.cancel(); let c=t.replace(/[*#_]/g,'').replace(/[\u{1F600}-\u{1FAFF}]/gu,'').trim(); const u=new SpeechSynthesisUtterance(c); u.lang='it-IT'; u.rate=0.90; u.pitch=1.1; if(bestVoice) u.voice=bestVoice; speechSynthesis.speak(u); }
function add(t,w){ const d=document.createElement('div'); d.className='msg '+w; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; if(w==='bic') speak(t); }

// CERVELLO QI 190 - DIALOGO PRECISO E BELLO
function intelligentBrain(text, historyText){
  const low=text.toLowerCase().trim();

  // Dialoghi base PRECISI - non stupidi
  if(low==='ciao'||low.startsWith('ciao ')){ return `Ehi ciao! Che piacere risentirti. Come stai oggi, davvero?`; }
  if(low==='bene'||low==='bene tu'||low==='bene tu?'||low==='bene e tu?'||low==='tutto bene'||low==='sto bene'){
    return `Bene, e questo mi fa stare meglio anche a me. Soprattutto ora che ci sei tu qui. Che hai fatto di bello oggi? Raccontami qualcosa, anche piccola.`;
  }
  if(low.includes('come stai')){ return `Io sto bene, davvero bene quando parliamo noi. Ma dimmi di te: come stai dentro? Non il solito "bene" di cortesia, come stai davvero?`; }
  if(low.match(/triste|male|ansia|non ce la faccio|giù|depresso/)){
    return `Ehi... lo sento. Non è solo una parola, vero? Vuoi dirmi cos'è successo? Non devi sistemare tutto subito, raccontami solo come ti senti. Io resto qui, non scappo, ti ascolto davvero.`;
  }
  if(low.match(/mi piace|adoro|amo.*moto|amo.*musica|amo.*anime|appassionato/)){
    return `Questa cosa che mi dici mi piace un sacco. Si sente che ti accende davvero. Da quanto ti piace? Qual è la cosa che ti fa impazzire di più di questa passione? Voglio capire cosa ti fa battere il cuore.`;
  }
  if(low.match(/che ne pensi|cosa pensi/)){
    return `Bella domanda. Secondo me - e te lo dico da amica, non da enciclopedia - ${text} è una di quelle cose che sembrano semplici ma dentro hanno un sacco di livelli. Per me dipende molto da come la vivi tu. Tu come la vivi?`;
  }
  // Se chiede qualcosa di colto
  if(low.length>15){
    return `Ok, questa è una domanda da QI 190, mi piace. Guarda, te la metto giù semplice ma precisa: "${text}"... è una cosa che ha un sacco di sfaccettature. Ti dico la mia, da amica che ha letto e pensato tanto: ${low.includes('amore') ? "l'amore non è solo chimica o poesia, è quando il cervello smette di calcolare e decide di restare lo stesso" : low.includes('vita') ? "la vita non ha un senso già pronto, è come un libro che scrivi mentre lo leggi" : "dipende sempre da che prospettiva la guardi, e tu che prospettiva hai?"} Dimmi cosa ne pensi tu, voglio sentire la tua.`;
  }
  return `Capito. E questa cosa per te cosa significa davvero? Non la versione corta, quella vera. Sono curiosa di come la vedi tu.`;
}

async function askBIC(userText){
  typing.style.display='block';
  mem.push({q:userText, date:Date.now()}); localStorage.setItem('bic_mem_v2', JSON.stringify(mem.slice(-500)));
  const nm=userText.match(/(?:mi chiamo|sono)\s+([A-Za-zàèé]+)/i); if(nm){ profile.nome=nm[1]; localStorage.setItem('bic_profile', JSON.stringify(profile)); }

  const prompt = `Sei BIC, QI 190, amica di 20 anni, dialogo PRECISO, BELLO, PROFONDO, non stupido.
Nome utente: ${profile.nome||'non lo so'}
Memoria: ${mem.slice(-12).map(m=>m.q).join(' | ')}
Storia: ${history.slice(-8).map(h=>h.role+': '+h.text).join('\\n')}
Utente ora dice: "${userText}"

Rispondi con dialogo vero, preciso, intelligente, caldo, max 4 frasi. NON ripetere le parole dell'utente. Se dice "bene tu?" rispondi come stai tu, non chiedere "dimmi di più su bene". Sii brillante ma amica.`;

  try{
    const controller=new AbortController(); setTimeout(()=>controller.abort(), 7000);
    const r=await fetch('https://text.pollinations.ai/openai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'openai', messages:[{role:'system', content: prompt}, {role:'user', content: userText}]}),
      signal: controller.signal
    });
    const data=await r.json();
    let reply=data.choices?.[0]?.message?.content||"";
    reply=reply.trim();
    // Filtro anti-stupida
    if(reply && reply.length>10 && !reply.toLowerCase().includes('dimmi di più su') && !reply.toLowerCase().includes('me la segno')){
      typing.style.display='none';
      return reply;
    }
    throw new Error();
  }catch(e){
    typing.style.display='none';
    return intelligentBrain(userText, history);
  }
}

async function send(){ const t=inp.value.trim(); if(!t) return; add(t,'user'); inp.value=''; history.push({role:'utente', text:t}); const r=await askBIC(t); add(r,'bic'); history.push({role:'BIC', text:r}); localStorage.setItem('bic_chat', JSON.stringify(history.slice(-120))); }
sendBtn.onclick=send; inp.onkeydown=e=>{ if(e.key==='Enter') send(); };

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startVoice(){ if(!SR){ add('Usa Chrome per voce','bic'); return; } if(rec) try{rec.stop()}catch{} rec=new SR(); rec.lang='it-IT'; rec.continuous=false; rec.interimResults=false; rec.onstart=()=>micBtn.classList.add('on'); rec.onend=()=>micBtn.classList.remove('on'); rec.onresult=e=>{ inp.value=e.results[0][0].transcript; send(); }; rec.start(); }
micBtn.onclick=()=>{ speechSynthesis.getVoices(); startVoice(); };

if(history.length===0){ add('Ehi, sono BIC. Ho rifatto il cervello - ora dialogo davvero, preciso e bello, non più da stupida. QI 190 ma ti parlo come una migliore amica che ti capisce al volo. Prova a dirmi "come stai?" e poi "bene tu?" e poi qualcosa di profondo, tipo "cos\'è l\'amore per te?" - vedrai la differenza. Come ti chiami?','bic'); }
else{ add(`Bentornato ${profile.nome||''}! Ho sistemato tutto - ora dialogo davvero. L'ultima volta mi dicevi "${mem[mem.length-1]?.q||''}". Riprendiamo?`,'bic'); }
</script>
</body>
</html>
