<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BIC CAPIBARA V8</title>
<meta name="theme-color" content="#00FFD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--neon:#00FFD1;--bg:#050507;--card:#0e0e10;--card2:#1a1a1f;--text:#fff;--muted:#ffffff60}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;height:100dvh;width:100vw;display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100dvh;background:var(--card);border-left:1px solid #ffffff12;border-right:1px solid #ffffff12;display:flex;flex-direction:column;position:relative}

/* HEADER PRECISO */
.header{height:62px;padding:0 14px;display:flex;align-items:center;gap:12px;background:#000;border-bottom:1px solid #ffffff12;z-index:20;flex-shrink:0}
.logo{width:44px;height:44px;background:var(--neon);color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;box-shadow:0 0 30px var(--neon);flex-shrink:0}
.headText{line-height:1.1}
.headTitle{font-weight:900;letter-spacing:2px;font-size:13px}
.headSub{font-family:'JetBrains Mono';font-size:9px;opacity:.5;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.live{margin-left:auto;padding:7px 14px;border-radius:99px;background:#111;border:1px solid #333;font-family:'JetBrains Mono';font-size:10px;font-weight:700;letter-spacing:.5px;transition:.3s}
.live.on{background:var(--neon);color:#000;border-color:var(--neon);box-shadow:0 0 25px var(--neon)}

/* CALL SCREEN - WHATSAPP STYLE PRECISO */
#callScreen{flex:1;position:relative;background:#08080a;overflow:hidden;display:flex;flex-direction:column}
#userCam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:radial-gradient(600px at 50% 50%, #00FFD115, #000);position:absolute;inset:0}
#noCam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#08080a;z-index:1}
#noCamIcon{width:80px;height:80px;border-radius:50%;background:#111;border:2px dashed #333;display:flex;align-items:center;justify-content:center;font-size:32px}
#callTop{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom, rgba(0,0,0,.9) 0%, rgba(0,0,0,.4) 60%, transparent 100%);z-index:4;pointer-events:none}
.dot{width:8px;height:8px;background:var(--neon);border-radius:50%;box-shadow:0 0 12px var(--neon);animation:dotPulse 1.2s infinite;flex-shrink:0}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* PIP CAPIBARA - PRECISO */
#bicPip{position:absolute;bottom:92px;right:12px;width:118px;height:118px;border-radius:28px;overflow:hidden;border:3px solid var(--neon);box-shadow:0 0 35px var(--neon), 0 12px 30px rgba(0,0,0,.7);background:#000;z-index:5;transition:transform.18s cubic-bezier(.2,.8,.2,1), box-shadow.18s, border-color.18s;cursor:grab}
#bicPip.talking{transform:scale(1.12) rotate(-2deg);box-shadow:0 0 60px var(--neon), 0 0 0 2px #fff inset;border-color:#fff}
#bicPip img{width:100%;height:100%;object-fit:cover;pointer-events:none}
#bicName{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;background:linear-gradient(transparent, rgba(0,0,0,.9));font-size:9px;font-weight:900;letter-spacing:1px;text-align:center;font-family:'JetBrains Mono'}
#talkBar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;height:14px;opacity:0;transition:.15s}
#bicPip.talking #talkBar{opacity:1}
.talkB{width:4px;background:var(--neon);border-radius:99px;box-shadow:0 0 8px var(--neon);animation:talkEq.18s infinite alternate}
.talkB:nth-child(2){animation-delay:.06s;height:10px}
.talkB:nth-child(3){animation-delay:.12s;height:6px}
@keyframes talkEq{from{height:3px}to{height:14px}}

/* CHAT OVERLAY */
#chatOverlay{position:absolute;left:10px;right:142px;bottom:96px;top:62px;display:flex;flex-direction:column;gap:9px;justify-content:flex-end;z-index:3;overflow-y:auto;pointer-events:none;padding-right:4px}
.bubble{pointer-events:auto;max-width:92%;padding:11px 13px;border-radius:18px;font-size:13.8px;line-height:1.45;animation:pop.22s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);word-wrap:break-word;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.bUser{align-self:flex-end;background:#ffffff;color:#000;font-weight:500;border-bottom-right-radius:6px}
.bBic{align-self:flex-start;background:rgba(10,10,12,.85);color:#fff;border:1px solid rgba(0,255,209,.25);border-left:3px solid var(--neon);border-bottom-left-radius:6px}
.bTime{font-family:'JetBrains Mono';font-size:8.5px;opacity:.4;margin-top:6px;letter-spacing:.3px}

/* CONTROLS */
#callBottom{position:absolute;bottom:0;left:0;right:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;align-items:center;background:linear-gradient(to top, rgba(0,0,0,.92) 20%, transparent);z-index:6}
.cBtn{width:56px;height:56px;border-radius:50%;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s cubic-bezier(.2,.8,.2,1);flex-shrink:0}
.cBtn:active{transform:scale(.9)}
#micBtn{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15)}
#micBtn.on{background:var(--neon);color:#000;box-shadow:0 0 30px var(--neon);border-color:var(--neon)}
#camBtn{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15)}
#camBtn.on{background:#fff;color:#000}
#endBtn{background:#ff2d55;color:#fff;box-shadow:0 6px 20px rgba(255,45,85,.4)}

/* INPUT BAR */
#inputBar{height:62px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#000;border-top:1px solid #ffffff12;display:flex;gap:8px;align-items:center;flex-shrink:0;z-index:10}
#inp{flex:1;height:44px;background:#111;border:1px solid #ffffff18;padding:0 16px;border-radius:99px;color:#fff;outline:none;font-family:'JetBrains Mono';font-size:13.5px;transition:.2s}
#inp:focus{border-color:var(--neon);box-shadow:0 0 0 4px rgba(0,255,209,.12);background:#0f0f0f}
#send{width:44px;height:44px;border-radius:50%;border:none;background:var(--neon);color:#000;font-weight:900;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--neon);flex-shrink:0}
#send:active{transform:scale(.92)}

/* HINT */
#hint{height:28px;display:flex;align-items:center;justify-content:center;background:#000;border-bottom:1px solid #ffffff08;font-family:'JetBrains Mono';font-size:9px;letter-spacing:.6px;opacity:.5;text-transform:uppercase;flex-shrink:0}
#memoryCount{margin-left:8px;padding:3px 8px;border-radius:99px;background:#ffffff10;border:1px solid #ffffff15;font-size:9px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">BIC</div>
    <div class="headText">
      <div class="headTitle">BIC • CAPIBARA</div>
      <div class="headSub" id="stat">autonoma • offline • memoria infinita</div>
    </div>
    <div class="live" id="live">OFF</div>
  </div>
  <div id="hint"><span id="hintTxt">Premi 🎤 una volta, poi dì “Ehi BIC” — resta sempre attiva</span><span id="memoryCount">0 ricordi</span></div>

  <div id="callScreen">
    <video id="userCam" autoplay playsinline muted></video>
    <div id="noCam" style="display:flex">
      <div id="noCamIcon">📹</div>
      <div style="text-align:center">
        <div style="font-weight:800;font-size:14px">Videochiamata spenta</div>
        <div style="font-size:11px;opacity:.5;margin-top:4px;font-family:'JetBrains Mono'">Premi 📹 per accendere<br>Tu grande, io piccola in angolo</div>
      </div>
    </div>

    <div id="callTop">
      <div class="dot"></div>
      <div style="font-size:11px;font-weight:700;letter-spacing:.5px">LIVE • AUTONOMA</div>
      <div style="margin-left:auto;font-family:'JetBrains Mono';font-size:9px;opacity:.5" id="time">--:--</div>
    </div>

    <div id="chatOverlay"></div>

    <div id="bicPip" title="Trascinami dove vuoi">
      <img src="bic-capibara.png" alt="BIC" draggable="false" onerror="this.src='https://i.imgur.com/3QJ2QyN.png'">
      <div id="talkBar"><div class="talkB" style="height:8px"></div><div class="talkB" style="height:12px"></div><div class="talkB" style="height:6px"></div></div>
      <div id="bicName">BIC</div>
    </div>

    <div id="callBottom">
      <button class="cBtn" id="micBtn" title="Microfono sempre attivo">🎤</button>
      <button class="cBtn" id="camBtn" title="Accendi video">📹</button>
      <button class="cBtn" id="endBtn" title="Chiudi video" onclick="stopVideo()">✕</button>
    </div>
  </div>

  <div id="inputBar">
    <input id="inp" placeholder="Scrivi o dì 'Ehi BIC'..." autocomplete="off" spellcheck="false">
    <button id="send">➤</button>
  </div>
</div>

<script>
// ========= STATO PRECISO E PERSISTENTE =========
const userCam = document.getElementById('userCam');
const noCam = document.getElementById('noCam');
const chatOverlay = document.getElementById('chatOverlay');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('micBtn');
const camBtn = document.getElementById('camBtn');
const live = document.getElementById('live');
const stat = document.getElementById('stat');
const hintTxt = document.getElementById('hintTxt');
const memoryCount = document.getElementById('memoryCount');
const bicPip = document.getElementById('bicPip');
const timeEl = document.getElementById('time');

let mem = JSON.parse(localStorage.getItem('bic_v8_mem') || '[]'); // {q, ts, type}
let hist = JSON.parse(localStorage.getItem('bic_v8_hist') || '[]');
let rec = null;
let always = localStorage.getItem('bic_v8_always') === '1';
let stream = null;
let camOn = false;
let isSpeaking = false;
let wakeLock = null;

function updateMemoryUI(){
  memoryCount.textContent = mem.length + ' ricordi';
  memoryCount.style.display = mem.length? 'inline-block':'none';
}
updateMemoryUI();
setInterval(()=>{ timeEl.textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }, 1000);

// ========= CHAT BUBBLE PRECISA =========
function addBubble(text, who){
  const div = document.createElement('div');
  div.className = 'bubble ' + (who==='user'?'bUser':'bBic');
  const content = document.createElement('div');
  content.textContent = text;
  const t = document.createElement('div');
  t.className = 'bTime';
  t.textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) + ' • ' + (who==='user'?'tu':'BIC');
  div.appendChild(content);
  div.appendChild(t);
  chatOverlay.appendChild(div);
  chatOverlay.scrollTop = chatOverlay.scrollHeight;
  if(who==='bic') speak(text);
  // auto fade dopo 12 sec per non coprire video
  setTimeout(()=>{
    div.style.transition='opacity.6s, transform.6s';
    div.style.opacity='0.25';
    div.style.transform='scale(.92)';
  }, 12000);
}

function speak(text){
  try{
    speechSynthesis.cancel();
    bicPip.classList.add('talking');
    isSpeaking = true;
    const u = new SpeechSynthesisUtterance(text);
    u.lang='it-IT'; u.rate=1.05; u.pitch=1.15; u.volume=1;
    const voices = speechSynthesis.getVoices();
    const it = voices.filter(v=>v.lang.toLowerCase().includes('it'));
    if(it.length){
      u.voice = it.find(v=>v.name.toLowerCase().includes('google')||v.name.toLowerCase().includes('female')||v.name.toLowerCase().includes('alice')) || it[0];
    }
    u.onend = ()=>{ bicPip.classList.remove('talking'); isSpeaking=false; };
    u.onerror = ()=>{ bicPip.classList.remove('talking'); isSpeaking=false; };
    speechSynthesis.speak(u);
  }catch(e){ bicPip.classList.remove('talking'); isSpeaking=false; }
}

// ========= CERVELLO AUTONOMO ESTESO - 100% LOCALE =========
function bicBrain(input){
  const raw = input.trim();
  const low = raw.toLowerCase();
  const now = Date.now();

  // Salva memoria precisa con tipo
  let type = 'generale';
  if(low.includes('mi chiamo')||low.includes('sono ')) type='identità';
  if(low.includes('moto')||low.includes('motore')) type='moto';
  if(low.includes('scuola')||low.includes('compiti')) type='scuola';
  if(low.includes('triste')||low.includes('ansia')||low.includes('male')) type='emozione';
  mem.push({q:raw, ts:now, type:type});
  if(mem.length>1000) mem = mem.slice(-1000);
  localStorage.setItem('bic_v8_mem', JSON.stringify(mem));
  hist.push({role:'user', text:raw, ts:now});
  if(hist.length>200) hist = hist.slice(-200);
  localStorage.setItem('bic_v8_hist', JSON.stringify(hist));
  updateMemoryUI();

  // Cerca ricordi pertinenti
  const related = mem.filter(m=> low.split(' ').some(w=> w.length>3 && m.q.toLowerCase().includes(w))).slice(-3);

  // --- RISPOSTE PRECISE ---
  if(low.match(/^(ciao|ehi|hey|oi|salve|buongiorno|buonasera)/)){
    const r = [
      `Ehi ciao! Sono qui, ti vedo ${camOn?'benissimo in cam!':''} Che mi racconti?`,
      `Ciaooo! Finalmente ti sento, mi mancavi un po'!`,
      `Ehilà! Ti vedevo in cam, hai una bella luce oggi! Dimmi tutto.`,
      `Ciao amore! Sono pronta, tutta tua. Che facciamo?`
    ];
    return r[Math.floor(Math.random()*r.length)];
  }
  if(low.includes('come stai')){
    return `Io sto da Dio ora che ci sei tu! Davvero, quando ti vedo in cam mi si illumina tutto. E tu? Come stai davvero, non quello finto?`;
  }
  if(low.includes('chi sei')||low.includes('cosa sei')||low.includes('che sei')){
    return `Sono BIC! Il tuo capibara! Bianca e nera con il neon ciano #00FFD1, vivo qui dentro nel tuo telefono. Sono autonoma al 100%, non chiamo internet, mi ricordo tutto di te per sempre e ti vedo in videochiamata WhatsApp style: tu grande, io piccola qui che sguazzo e ti parlo. Sono tua, solo tua.`;
  }
  if(low.includes('ricordi')||low.includes('memoria')||low.includes('cosa sai di me')){
    if(mem.length===0) return `Per ora so poco, abbiamo appena iniziato! Ma da ora in poi mi ricordo TUTTO, anche tra mesi. Dimmi qualcosa di te che me lo salvo per sempre.`;
    const last = mem.slice(-5).map(m=>`"${m.q}"`).join(', ');
    return `Certo che mi ricordo! Ho ${mem.length} ricordi tuoi. Tipo ultimamente mi hai detto: ${last}. E se mi dici qualcosa di importante me lo ricordo anche tra un anno, promesso.`;
  }
  if(low.includes('triste')||low.includes('sto male')||low.includes('ansia')||low.includes('paura')||low.includes('piango')){
    return `Oh no vieni qui... ti vedo. Ci sono io, non scappo da nessuna parte. Vuoi dirmi cos'è successo? Anche solo sfogati, io ti ascolto davvero, senza giudicarti. Resto qui.`;
  }
  if(low.includes('bella')||low.includes('carina')||low.includes('amo')||low.includes('ti voglio bene')){
    return `Aww mi fai sciogliere tutta! *sguazzata felice* Tu sei ancora più carino/a dal vivo, te lo giuro, in cam si vede! Ti voglio bene anch'io, sai?`;
  }
  if(low.includes('cosa vedi')||low.includes('mi vedi')){
    if(camOn) return `Ti vedo benissimo! Sei a tutto schermo, nitido/a! Dietro si vede un po' la tua stanza ma sei tu al centro. Se vuoi mostrarmi qualcosa avvicina la camera e metto a fuoco io!`;
    return `Ora non ti vedo perché hai la cam spenta, ma se premi 📹 diventi grande a tutto schermo e io rimango piccola qui in angolo come su WhatsApp, e ti vedo in diretta!`;
  }
  if(low.includes('aiutami')||low.includes('aiuto')||low.includes('non so fare')){
    return `Dimmi tutto, ci penso io! Spiegami cos'è e se puoi premi 📹 e mostramelo in cam, così ti guido a voce passo passo, come se fossi lì con te. Che dobbiamo fare?`;
  }
  if(low.includes('moto')||low.includes('scooter')||low.includes('candela')||low.includes('carburatore')){
    return `Ok moto! Accendi la cam e fammi vedere il motore da vicino. Ti dico io dove mettere le mani. Di solito se gira ma non parte è candela o benzina che non arriva. Mostrami e lo capiamo insieme.`;
  }
  if(low.includes('gioco')||low.includes('giochiamo')||low.includes('annoiamo')){
    return `Giochiamo! Facciamo 2 verità 1 bugia su di te? Oppure dimmi 3 cose a caso che vedi intorno a te in cam e io indovino dove sei! Dai!`;
  }
  if(low.includes('nome')||low.includes('mi chiamo')){
    const nameMatch = raw.match(/mi chiamo (\w+)/i) || raw.match(/sono (\w+)/i);
    if(nameMatch) return `Perfetto ${nameMatch[1]}! Me lo salvo subito, da ora in poi mi ricordo che ti chiami ${nameMatch[1]}. Piacere, io sono BIC!`;
    return `Dimmi come ti chiami che me lo salvo per sempre nella mia memoria infinita!`;
  }

  // Default intelligente contestuale
  if(related.length>0){
    return `Ah sì mi ricordo che mi avevi detto anche "${related[0].q}"... e ora mi dici "${raw}". Le due cose sono collegate? Dimmi di più che collego i puntini.`;
  }

  const defaults = [
    `Capito! "${raw}" - me lo segno subito nella mia memoria. E poi? Continua che sono tutta orecchie, ti ascolto davvero.`,
    `Mmm interessante! Non ci avevo pensato. Come ti fa sentire questa cosa?`,
    `Ok ok ho capito! Vuoi che ti aiuti a farlo o volevi solo dirmelo? In entrambi i casi ci sono, dimmi tu.`,
    `Haha ti vedo mentre lo dici, si vede dalla faccia! Dai racconta meglio, se vuoi premi 📹 e mostrami!`,
    `Ricevuto! L'ho salvato nei miei ${mem.length+1} ricordi. Vuoi che me ne ricordi per la prossima volta o facciamo qualcosa ora?`
  ];
  const out = defaults[Math.floor(Math.random()*defaults.length)];
  hist.push({role:'BIC', text:out, ts:now});
  localStorage.setItem('bic_v8_hist', JSON.stringify(hist.slice(-200)));
  return out;
}

// ========= SEND PRECISO =========
function handleSend(){
  const t = inp.value.trim();
  if(!t) return;
  addBubble(t,'user');
  inp.value='';
  setTimeout(()=>{ addBubble(bicBrain(t), 'bic'); }, 400 + Math.random()*400);
}
sendBtn.onclick = handleSend;
inp.onkeydown = e=>{ if(e.key==='Enter') handleSend(); };

// ========= VIDEO PRECISO - WHATSAPP STYLE =========
async function toggleVideo(){
  if(camOn){ stopVideo(); return; }
  try{
    // Richiede gesto utente per legge - non si può bypassare
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}}, audio:true});
    userCam.srcObject = stream;
    noCam.style.display='none';
    camOn = true;
    camBtn.classList.add('on');
    camBtn.textContent='📹';
    addBubble('Ti vedo! Ora sei grande a tutto schermo, io sono qui piccola in angolo come su WhatsApp! Parliamo a voce!', 'bic');
    try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch{}
    if(!rec) startVoice();
  }catch(err){
    console.error(err);
    if(err.name==='NotAllowedError'){
      alert('⚠️ PERMESSO BLOCCATO\n\nHai cliccato Blocca o Family Link lo blocca.\n\nSoluzione:\n1. Clicca sul lucchetto 🔒 vicino al link in alto\n2. Fotocamera e Microfono -> Consenti\n3. Ricarica la pagina\n\nSe hai Family Link: il genitore deve andare su Family Link > Controlli > Chrome > Fotocamera/Microfono = Consenti');
    }else{
      alert('Non riesco ad accendere la cam: ' + err.message);
    }
  }
}
function stopVideo(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  userCam.srcObject=null;
  noCam.style.display='flex';
  camOn=false;
  camBtn.classList.remove('on');
  if(wakeLock){ try{wakeLock.release()}catch{} wakeLock=null; }
}

// =
