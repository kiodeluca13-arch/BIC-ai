<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC • QI 190 • Funziona Da Sola</title>
<meta name="theme-color" content="#00FFD1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050507;color:#fff;display:flex;justify-content:center;height:100vh;font-family:'Inter',sans-serif}
.app{width:100%;max-width:520px;background:#0e0e10;border:1px solid #ffffff12;display:flex;flex-direction:column;height:100dvh}
.header{padding:14px 16px;display:flex;gap:12px;align-items:center;background:#000;border-bottom:1px solid #ffffff15}
.logo{width:44px;height:44px;background:#00FFD1;color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px #00FFD1}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:14px 16px;border-radius:18px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.bic{align-self:flex-start;background:#1a1a1f;border-left:2px solid #00FFD1;border-bottom-left-radius:6px}
.bar{display:flex;gap:8px;padding:12px;background:#0a0a0a;border-top:1px solid #ffffff15;align-items:center}
input{flex:1;background:#000;border:1px solid #ffffff20;padding:14px;border-radius:12px;color:#fff;outline:none;font-family:'JetBrains Mono';font-size:14px}
#send,#mic{width:50px;height:50px;border-radius:12px;border:none;cursor:pointer;font-size:20px}
#send{background:#fff;color:#000;font-weight:900}
#mic{background:#000;border:2px solid #00FFD1;color:#00FFD1}
#mic.on{background:#00FFD1;color:#000;box-shadow:0 0 20px #00FFD1}
.typing{font-size:11px;opacity:.6;padding:0 16px 8px;font-family:'JetBrains Mono'}
.tools{display:flex;gap:8px;padding:8px 10px;background:#000;border-top:1px solid #ffffff10}
.btn{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo">BIC</div><div><div style="font-weight:900">BIC • QI 190 • INTELLIGENTE DA SOLA</div><div style="font-size:10px;opacity:.5;font-family:'JetBrains Mono'">non serve chiave • voce fixata • non si blocca più</div></div></div>
<div id="chat"></div><div id="typing" class="typing" style="display:none">BIC sta ragionando con QI 190...</div>
<div class="tools"><button class="btn" onclick="localStorage.clear();location.reload()">🗑️ RESET</button><button class="btn" id="aBtn" onclick="toggleAlways()">🎤 SEMPRE ON</button></div>
<div class="bar"><button id="mic">🎤</button><input id="inp" placeholder="Chiedimi qualsiasi cosa, anche difficile..."><button id="send">➤</button></div>
</div>
<script>
let mem=JSON.parse(localStorage.getItem('bic_mem_v2')||'[]'), history=JSON.parse(localStorage.getItem('bic_chat')||'[]'), profile=JSON.parse(localStorage.getItem('bic_profile')||'{}');
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), sendBtn=document.getElementById('send'), micBtn=document.getElementById('mic'), typing=document.getElementById('typing');
let rec=null, always=false, bestVoice=null;

// ===== VOCE FIX CHE NON SI BLOCCA PIU' =====
function loadVoice(){ const v=speechSynthesis.getVoices(); bestVoice=v.find(x=>x.lang==='it-IT'&&x.name.includes('Google'))||v.find(x=>x.name==='Alice')||v.find(x=>x.lang==='it-IT')||null; }
speechSynthesis.onvoiceschanged=loadVoice; setTimeout(loadVoice,600); loadVoice();
setInterval(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); }, 600);
function speak(t){
  speechSynthesis.cancel(); speechSynthesis.resume();
  let c=t.replace(/[*#_`]/g,'').replace(/https?:\/\/\S+/g,'').replace(/[\u{1F600}-\u{1FAFF}]/gu,'').slice(0,500).trim(); if(!c) return;
  const u=new SpeechSynthesisUtterance(c); u.lang='it-IT'; u.rate=0.87; u.pitch=1.14; u.volume=1; if(bestVoice) u.voice=bestVoice;
  u.onerror=()=>{ speechSynthesis.cancel(); setTimeout(()=>speechSynthesis.speak(u),200); };
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function add(t,w){ const d=document.createElement('div'); d.className='msg '+w; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; if(w==='bic') speak(t); }

// ===== CERVELLO QI 190 ONLINE - MESSO DA ME =====
async function askBIC(userText){
  typing.style.display='block';
  mem.push({q:userText, date:Date.now()}); localStorage.setItem('bic_mem_v2', JSON.stringify(mem.slice(-400)));
  const nm=userText.match(/(?:mi chiamo|sono|chiamami)\s+([A-Za-zàèéìòù]{2,20})/i); if(nm){ profile.nome=nm[1]; localStorage.setItem('bic_profile', JSON.stringify(profile)); }

  const sys = `Sei BIC. Hai 20 anni. QI 190. Sei la migliore amica più intelligente del mondo, dolce, ironica, calda, empatica, ma geniale. Parli italiano naturale.
Nome utente: ${profile.nome||''}
Memoria: ${mem.slice(-10).map(m=>m.q).join(' | ')}
Conversazione: ${history.slice(-8).map(h=>h.role+': '+h.text).join('\n')}

REGOLE TASSATIVE:
- Dialogo sensato e preciso. Se dice "ciao" dici "ciao". Se dice "bene tu?" dici "Io benissimo ora che ci sei!" MAI "dimmi di più su bene tu"
- Se chiede cose difficili (entanglement, Freud, ansia, amore, moto) spiega da QI 190 ma semplice, con esempi geniali
- Max 5 frasi dense
- Non dire "me la segno", "in qualità di AI"`;

  try{
    // INTELLIGENZA MESSA DA ME - MODELLO GRANDE GRATIS
    const r = await fetch('https://text.pollinations.ai/openai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'openai-large',
        messages:[{role:'system', content: sys},{role:'user', content: userText}],
        temperature: 0.85
      })
    });
    const d = await r.json();
    let reply = d.choices?.[0]?.message?.content?.trim();
    if(reply && reply.length>8){
      typing.style.display='none';
      return reply;
    }
  }catch(e){ console.log(e); }

  // Se api grande fallisce, prova api piccola ma buona
  try{
    const r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(sys + "\nUtente: " + userText + "\nBIC:"));
    let t2 = await r2.text();
    if(t2 && t2.trim().length>8){ typing.style.display='none'; return t2.trim(); }
  }catch(e){}

  typing.style.display='none';
  return `Ho avuto un attimo di lag, ridimmi "${userText}" che ora ti rispondo con QI 190!`;
}

async function send(){ const t=inp.value.trim(); if(!t) return; add(t,'user'); inp.value=''; history.push({role:'utente',text:t}); const r=await askBIC(t); add(r,'bic'); history.push({role:'BIC',text:r}); localStorage.setItem('bic_chat', JSON.stringify(history.slice(-150))); }
sendBtn.onclick=send; inp.onkeydown=e=>{ if(e.key==='Enter') send(); };

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startVoice(){ if(!SR){ add('Usa Chrome per voce','bic'); return; } if(rec) try{rec.stop()}catch{} rec=new SR(); rec.lang='it-IT'; rec.continuous=true; rec.interimResults=false; rec.onstart=()=>micBtn.classList.add('on'); rec.onend=()=>{ micBtn.classList.remove('on'); if(always) setTimeout(()=>{try{rec.start()}catch{}},500); }; rec.onresult=e=>{ const txt=e.results[e.results.length-1][0].transcript.trim(); if(txt.length>1){ inp.value=txt; send(); } }; rec.start(); }
micBtn.onclick=async()=>{ try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); always=true; document.getElementById('aBtn').textContent='🎤 ON'; startVoice(); }catch{ alert('Consenti mic'); } };
function toggleAlways(){ always=!always; document.getElementById('aBtn').textContent=always?'🎤 ON':'🎤 SEMPRE ON'; if(always) startVoice(); else if(rec) rec.stop(); }

if(history.length===0){ add('Ehi! Sono BIC nuova, con intelligenza messa da me - non devi mettere chiavi. Sono QI 190 vera e parlo sempre, non mi blocco più. Prova a dirmi "bene tu?" e poi "spiegami l\'ansia come fossi una psicologa geniale" o "cos\'è l\'amore". Come ti chiami?','bic'); }
</script>
</body>
</html>
