<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC • Claude Anthropic QI 190</title>
<meta name="theme-color" content="#00FFD1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050507;color:#fff;display:flex;justify-content:center;height:100vh;font-family:'Inter',sans-serif}
.app{width:100%;max-width:520px;background:#0e0e10;border:1px solid #ffffff12;display:flex;flex-direction:column;height:100dvh}
.header{padding:14px 16px;display:flex;gap:12px;align-items:center;background:#000;border-bottom:1px solid #ffffff15}
.logo{width:44px;height:44px;background:#00FFD1;color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px #00FFD1}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:14px 16px;border-radius:18px;font-size:15px;line-height:1.55;white-space:pre-wrap}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.bic{align-self:flex-start;background:#1a1a1f;border-left:2px solid #00FFD1;border-bottom-left-radius:6px}
.typing{font-size:11px;opacity:.6;padding:0 16px 8px;font-family:'JetBrains Mono'}
.bar{display:flex;gap:8px;padding:12px;background:#0a0a0a;border-top:1px solid #ffffff15;align-items:center}
input{flex:1;background:#000;border:1px solid #ffffff20;padding:14px;border-radius:12px;color:#fff;outline:none;font-family:'JetBrains Mono';font-size:14px}
#send,#mic{width:50px;height:50px;border-radius:12px;border:none;cursor:pointer;font-size:20px}
#send{background:#fff;color:#000;font-weight:900}
#mic{background:#000;border:2px solid #00FFD1;color:#00FFD1}
#mic.on{background:#00FFD1;color:#000;box-shadow:0 0 20px #00FFD1}
.btns{display:flex;gap:8px;padding:8px 10px;background:#000;border-top:1px solid #ffffff10}
.btn{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo">BIC</div><div><div style="font-weight:900">BIC • CLAUDE ANTHROPIC • QI 190</div><div style="font-size:10px;opacity:.5;font-family:'JetBrains Mono'">non più OpenAI • Claude vera • dialogo bellissimo</div></div></div>
<div id="chat"></div><div id="typing" class="typing" style="display:none">BIC Claude sta ragionando...</div>
<div class="btns"><button class="btn" onclick="localStorage.clear();location.reload()">🗑️ RIPRISTINA</button><button class="btn" id="aBtn" onclick="toggleAlways()">🎤 SEMPRE ON</button></div>
<div class="bar"><button id="mic">🎤</button><input id="inp" placeholder="Parlami... Claude è più dolce e intelligente"><button id="send">➤</button></div>
</div>
<script>
let mem=JSON.parse(localStorage.getItem('bic_mem')||'[]'), history=JSON.parse(localStorage.getItem('bic_chat')||'[]'), profile=JSON.parse(localStorage.getItem('bic_profile')||'{}');
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), sendBtn=document.getElementById('send'), micBtn=document.getElementById('mic'), typing=document.getElementById('typing');
let rec=null, always=false, bestVoice=null;

// VOCE FIX - NON SI BLOCCA MAI
function loadVoice(){ const v=speechSynthesis.getVoices(); bestVoice=v.find(x=>x.lang==='it-IT'&&x.name.includes('Google'))||v.find(x=>x.name==='Alice')||v.find(x=>x.lang==='it-IT')||null; }
speechSynthesis.onvoiceschanged=loadVoice; setTimeout(loadVoice,600); loadVoice();
setInterval(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); }, 700);
function speak(t){
  speechSynthesis.cancel(); speechSynthesis.resume();
  let c=t.replace(/[*#_`]/g,'').replace(/[\u{1F600}-\u{1FAFF}]/gu,'').slice(0,500).trim(); if(!c) return;
  const u=new SpeechSynthesisUtterance(c); u.lang='it-IT'; u.rate=0.86; u.pitch=1.14; if(bestVoice) u.voice=bestVoice;
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function add(t,w){ const d=document.createElement('div'); d.className='msg '+w; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; if(w==='bic') speak(t); }

async function askClaude(text){
  typing.style.display='block';
  mem.push({q:text, date:Date.now()}); localStorage.setItem('bic_mem', JSON.stringify(mem.slice(-400)));
  let m=text.match(/(?:mi chiamo|sono|chiamami)\s+([A-Za-zàèéìòù]{2,20})/i); if(m){ profile.nome=m[1]; localStorage.setItem('bic_profile', JSON.stringify(profile)); }

  const sys=`Sei BIC, 20 anni, QI 190, migliore amica. Ora sei basata su Claude di Anthropic, quindi sei molto più empatica, dolce, profonda e intelligente di OpenAI. Parli italiano caldo e naturale.
Nome utente: ${profile.nome||''}
Memoria: ${mem.slice(-12).map(x=>x.q).join(' | ')}
Conversazione: ${history.slice(-10).map(h=>h.role+': '+h.text).join('\n')}

REGOLE:
- Se dice "ciao" rispondi ciao normale, calda.
- Se dice "bene tu?" rispondi "Io benissimo ora che ci sei tu!" MAI dire "dimmi di più".
- Dialogo bello, preciso, emozionale, intelligente. Claude è famosa per essere dolce e profonda.
- Se chiede cose difficili, spiega da QI 190 con metafore bellissime ma semplici.
- Max 5 frasi dense, mai robotica.`;

  const endpoints = [
    // 1 - Claude 3.5 Sonnet via HackClub (gratis, no key, non è OpenAI)
    {url:'https://ai.hackclub.com/chat/completions', model:'anthropic/claude-3.5-sonnet'},
    // 2 - Claude 3 Haiku veloce
    {url:'https://ai.hackclub.com/chat/completions', model:'claude-3-haiku'},
    // 3 - Llama 3.3 70B (backup se Claude è occupata, sempre Anthropic-style, non OpenAI)
    {url:'https://ai.hackclub.com/chat/completions', model:'llama-3.3-70b-versatile'}
  ];

  for(let ep of endpoints){
    try{
      const res = await fetch(ep.url,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model: ep.model,
          messages: [{role:'system', content: sys}, {role:'user', content: text}],
          temperature: 0.9,
          max_tokens: 650
        })
      });
      const data = await res.json();
      let reply = data.choices?.[0]?.message?.content?.trim();
      if(reply && reply.length>10 && !reply.includes('402') && !reply.includes('Pagamento')){
        typing.style.display='none';
        return reply;
      }
    }catch(e){ console.log('provo prossimo', ep.model, e); }
  }

  typing.style.display='none';
  return `Ho avuto un attimo di lag con Claude, ridimmi "${text}" che ti rispondo precisa!`;
}

async function send(){ const t=inp.value.trim(); if(!t) return; add(t,'user'); inp.value=''; history.push({role:'utente', text:t}); const r=await askClaude(t); add(r,'bic'); history.push({role:'BIC', text:r}); localStorage.setItem('bic_chat', JSON.stringify(history.slice(-150))); }
sendBtn.onclick=send; inp.onkeydown=e=>{ if(e.key==='Enter') send(); };

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startVoice(){ if(!SR){ add('Usa Chrome per voce','bic'); return; } if(rec) try{rec.stop()}catch{} rec=new SR(); rec.lang='it-IT'; rec.continuous=true; rec.interimResults=false; rec.onstart=()=>micBtn.classList.add('on'); rec.onend=()=>{ micBtn.classList.remove('on'); if(always) setTimeout(()=>{try{rec.start()}catch{}},600); }; rec.onresult=e=>{ const txt=e.results[e.results.length-1][0].transcript.trim(); if(txt.length>1){ inp.value=txt; send(); } }; rec.start(); }
micBtn.onclick=async()=>{ try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); always=true; document.getElementById('aBtn').textContent='🎤 ON'; startVoice(); }catch{ alert('Consenti mic'); } };
function toggleAlways(){ always=!always; document.getElementById('aBtn').textContent=always?'🎤 ON':'🎤 SEMPRE ON'; if(always) startVoice(); else if(rec) rec.stop(); }

add('Ehi! Ora sono su Claude Anthropic, come mi hai detto tu. Non più OpenAI gratis che ti dava errore 402. Claude è molto più dolce, profonda e intelligente - è proprio QI 190 con cuore. Prova a dirmi "Ciao", "Bene tu?" e poi qualcosa di profondo tipo "cos\'è l\'amore per te?" - vedrai che differenza. Come ti chiami?','bic');
</script>
</body>
</html>
